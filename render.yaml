services:
  - type: web
    name: 1987-bdc-os-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: BURST_BUFFER_SECONDS
        value: "15"
      - key: CONTACT_MUTEX_TTL_SECONDS
        value: "30"
      - key: BURST_BUFFER_CONTROL_TTL_SECONDS
        value: "90"
      - key: QUALIFICATION_FLOW_ENABLED
        value: "true"
      - key: QUALIFICATION_SIGNAL_ENABLED
        value: "false"
      - key: SOFIA_ENABLED
        value: "false"
      - key: CONVERSATIONAL_AI_ENABLED
        value: "false"
      - key: CONVERSATIONAL_AI_SEND_ENABLED
        value: "false"
      - key: CONVERSATIONAL_MODEL_BASE_URL
        value: https://api.openai.com/v1
      - key: CONVERSATIONAL_MODEL_API_KEY
        sync: false
      - key: CONVERSATIONAL_EXTRACTION_MODEL
        value: gpt-5.6-luna
      - key: CONVERSATIONAL_DRAFTING_MODEL
        value: gpt-5.6-luna
      - key: CONVERSATIONAL_MODEL_TIMEOUT_MS
        value: "20000"
      - key: MEDIA_UNDERSTANDING_ENABLED
        value: "false"
      - key: WHISPER_CLI_PATH
        value: /opt/whisper/bin/whisper-cli
      - key: WHISPER_MODEL_PATH
        value: /opt/whisper/models/ggml-base.bin
      - key: TESSERACT_CLI_PATH
        value: /usr/bin/tesseract
      - key: QUALIFICATION_SIGNAL_POLL_MS
        value: "5000"
      - key: META_CAPI_EVENT_NAME
        value: Lead_Calificado
      - key: META_CAPI_DEALERS_JSON
        sync: false
      - key: WEBHOOK_QUEUE_MAX_ATTEMPTS
        value: "5"
      - key: WEBHOOK_QUEUE_BACKOFF_MS
        value: "1000"
      - key: WEBHOOK_QUEUE_MAX_BACKOFF_MS
        value: "60000"
      - key: ENCRYPTION_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: POLICY_DIAGNOSTIC_TOKEN
        sync: false
