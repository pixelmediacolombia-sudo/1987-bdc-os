services:
  - type: web
    name: 1987-bdc-os-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: BURST_BUFFER_SECONDS
        value: "15"
      - key: CONTACT_MUTEX_TTL_SECONDS
        value: "30"
      - key: BURST_BUFFER_CONTROL_TTL_SECONDS
        value: "90"
      - key: QUALIFICATION_SIGNAL_ENABLED
        value: "false"
      - key: SOFIA_ENABLED
        value: "true"
      - key: SOFIA_DEALER_NAME
        value: Koons Automotive of Culpeper
      - key: QUALIFICATION_SIGNAL_POLL_MS
        value: "5000"
      - key: META_CAPI_EVENT_NAME
        value: Lead_Calificado
      - key: META_CAPI_DATASET_COUNTRY_CLUB
        sync: false
      - key: META_CAPI_TOKEN_COUNTRY_CLUB
        sync: false
      - key: META_CAPI_DATASET_OFFLEASE
        sync: false
      - key: META_CAPI_TOKEN_OFFLEASE
        sync: false
      - key: META_CAPI_DATASET_KOONS_CULPEPER
        sync: false
      - key: META_CAPI_TOKEN_KOONS_CULPEPER
        sync: false
      - key: META_CAPI_DATASET_KOONS_FBURG_ES
        sync: false
      - key: META_CAPI_TOKEN_KOONS_FBURG_ES
        sync: false
      - key: META_CAPI_DATASET_ACTION
        sync: false
      - key: META_CAPI_TOKEN_ACTION
        sync: false
      - key: META_CAPI_DATASET_ARLINGTON
        sync: false
      - key: META_CAPI_TOKEN_ARLINGTON
        sync: false
      - key: META_CAPI_DATASET_EASTERNS_ES
        sync: false
      - key: META_CAPI_TOKEN_EASTERNS_ES
        sync: false
      - key: WEBHOOK_QUEUE_MAX_ATTEMPTS
        value: "5"
      - key: WEBHOOK_QUEUE_BACKOFF_MS
        value: "1000"
      - key: WEBHOOK_QUEUE_MAX_BACKOFF_MS
        value: "60000"
      - key: GHL_CLIENT_ID
        sync: false
      - key: GHL_CLIENT_SECRET
        sync: false
      - key: GHL_APP_VERSION_ID
        value: 6a84ce51032e61130732e5cd
      - key: GHL_REDIRECT_URI
        sync: false
      - key: GHL_AUTHORIZATION_URL
        value: https://marketplace.gohighlevel.com/oauth/chooselocation
      - key: GHL_TOKEN_URL
        value: https://services.leadconnectorhq.com/oauth/token
      - key: GHL_SCOPES
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: POLICY_DIAGNOSTIC_TOKEN
        sync: false
